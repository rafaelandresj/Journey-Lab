<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Journey Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna móvil tipo "constructor de flujo"; cada paso es una tarjeta, el resultado es un journey + iPhone simulado */
:root{
  --bg:#F5F3F9; --surface:#FFFFFF; --ink:#1E1240; --muted:#645B80; --line:#E2DCF0;
  --accent:#4D20CE; --accent-ink:#FFFFFF; --blue:#713EC2; --soft:#EDE7F8; --soft-blue:#EDE7F8; --lav:#D5CDF2;
  --display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --body:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --mono:"Poppins",ui-sans-serif,system-ui,sans-serif;
}
:root,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.02;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);margin:0}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.progress span{height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.progress span.on{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.step-n{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
h2{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);transition:border-color .15s,background .15s}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt b{display:block;font-size:16px}
.opt small{color:var(--muted);font-size:14px;display:block}
.tag{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;background:var(--soft-blue);color:var(--blue);white-space:nowrap;align-self:flex-start;margin-left:auto}
.ico{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--soft-blue);color:var(--blue);font-family:var(--mono);font-size:13px;font-weight:500}
.opt.sel .ico{background:var(--accent);color:var(--accent-ink)}
input[type=text]{font:inherit;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:14px}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:3px solid var(--blue)}
.nav{display:flex;gap:10px}
.btn{all:unset;cursor:pointer;text-align:center;padding:14px 18px;border-radius:14px;font-weight:700;flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary[aria-disabled=true]{opacity:.4;cursor:not-allowed}
.btn.ghost{border:1.5px solid var(--line);flex:0 0 auto}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.msg-preview{font-size:15px;line-height:1.45}
/* resultado */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary div{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.summary span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.summary b{font-size:15px}
.flow{display:flex;flex-direction:column;gap:0;position:relative}
.node{display:grid;grid-template-columns:44px 1fr;gap:12px;position:relative;padding-bottom:16px}
.node:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.dot{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;background:var(--soft-blue);color:var(--blue)}
.dot.trigger{background:var(--ink);color:var(--bg)}
.dot.goal{background:var(--accent);color:var(--accent-ink)}
.node .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.node b{display:block}
.node p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cond{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px dashed var(--line);color:var(--muted)}
/* iPhone mockup: colores fijos a propósito, es un objeto físico */
.iphone{width:100%;max-width:310px;margin:0 auto;background:#111014;border-radius:52px;padding:11px;box-shadow:0 0 0 2px #3a3840,0 24px 50px rgba(30,18,64,.28)}
.screen{position:relative;border-radius:42px;overflow:hidden;min-height:600px;background:linear-gradient(165deg,#D5CDF2 0%,#713EC2 48%,#4D20CE 78%,#1E1240 100%);padding:14px 10px 70px;display:flex;flex-direction:column;gap:8px;font-family:-apple-system,"SF Pro Text",var(--body)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:92px;height:27px;border-radius:20px;background:#000}
.status{display:flex;justify-content:space-between;color:#fff;font-size:13px;font-weight:600;padding:0 16px;height:22px;align-items:center}
.status i{font-style:normal;letter-spacing:1px;font-size:11px}
.lock{text-align:center;color:#fff;margin:18px 0 18px}
.lock .d{font-size:15px;font-weight:500;opacity:.9}
.lock .h{font-size:72px;font-weight:600;line-height:1;letter-spacing:-2px}
.notif{background:rgba(245,243,249,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#111;border-radius:20px;padding:11px 12px;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;animation:pop .45s ease both}
.notif .app{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff}
.notif .app svg{width:20px;height:20px}
.notif .meta{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:#55525e}
.notif .meta b{color:#111;font-weight:600;text-transform:none}
.notif .t{font-weight:600;font-size:13.5px;line-height:1.3}
.notif .b{font-size:13.5px;line-height:1.3;color:#222;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.notif .cta{margin-top:6px;display:inline-block;background:#4D20CE;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
.qa{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:space-between;padding:0 34px}
.qa span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(10px)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.notif{animation:none}}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;color:var(--ink);font-size:15px}
.tips li{background:var(--soft);border-radius:12px;padding:12px 14px}
.senior{display:flex;gap:12px;align-items:center}
.senior .av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.done{font-size:clamp(30px,8vw,38px);font-weight:700;color:var(--accent);line-height:1.1;text-align:center}
#app{display:flex;flex-direction:column;gap:18px}
.card.top{padding-block:32px;gap:22px;margin-bottom:14px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
footer{text-align:center;color:var(--muted);font-size:12px;font-family:var(--mono)}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Expo Marketing · Unisimón</span>
    <h1>Hoy eres <em>Product Marketer</em></h1>
    <p class="lead">Con 5 decisiones vas a diseñar un journey automatizado que lleve a tu usuario de la interacción a la fidelización.</p>
  </header>
  <div class="progress" id="progress" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <main id="app"></main>
  <footer>Product Marketing y Retención · Commodo</footer>
</div>

<script>
const S={producto:"",tipo:"",objetivo:"",evento:"",canales:[],mensaje:-1,step:0};
const TIPOS=["App de delivery","E-commerce","Fintech / billetera","App de fitness","Streaming / música","Programa de puntos","Edtech"];
const OBJ={
 activacion:{n:"Activación",d:"Incentivar al usuario a conocer el producto por primera vez y llevarlo a su aha moment.",k:"Primera acción de valor",
  eventos:[["Se registró y no completó el perfil","24 h después del registro"],["Descargó la app pero no hizo su primera compra/uso","48 h sin primera acción"],["Abandonó el onboarding a mitad","1 h después de abandonar"]],
  msgs:[
   {tono:"Beneficio claro",t:"Tu primer paso trae premio 🎁",b:"Haz {primera} hoy y recibe {premio}. Te toma menos de 2 minutos."},
   {tono:"Guía personal",t:"¿Te ayudamos a empezar?",b:"Vimos que te quedaste a mitad de camino. Te mostramos cómo hacer {primera} en 3 pasos simples."},
   {tono:"Urgencia suave",t:"Tu bono de bienvenida vence pronto ⏳",b:"Tienes 48 horas para aprovechar {premio}. Solo haz {primera}."}]},
 retencion:{n:"Retención",d:"Incentivar al usuario a hacer una acción o compra dentro de la app, una y otra vez, hasta crear un hábito.",k:"Uso recurrente semanal",
  eventos:[["Lleva 7 días sin abrir la app","Día 7 de inactividad"],["Usó el producto 2 veces y se detuvo","Después de la 2.ª sesión + 5 días"],["Llegó su momento habitual de uso (día/hora)","Hora típica de uso"]],
  msgs:[
   {tono:"Recordatorio útil",t:"Te extrañamos 👋",b:"Tenemos {novedad}. Entra y descubre lo que te perdiste esta semana."},
   {tono:"Progreso / racha",t:"¡Vas en racha! 🔥 No la rompas",b:"Llevas 2 {usos} esta semana. Con {accion} más desbloqueas tu próximo nivel."},
   {tono:"Personalizado",t:"Lo de siempre, a un toque",b:"Llegó {momento} ✨ Dejamos listo {rutina} para que no pierdas tiempo."}]},
 fidelizacion:{n:"Fidelización",d:"Convertir a los usuarios frecuentes en fans que vuelven y recomiendan.",k:"Recompra + recomendación",
  eventos:[["Alcanzó un hito (5.ª compra, 30 días activo)","Al instante del hito"],["Está a 1 acción de ganar su recompensa","Cuando le falte 1 paso"],["Cumpleaños o aniversario con la marca","El día de la fecha"]],
  msgs:[
   {tono:"Reconocimiento",t:"Eres de los nuestros 💛",b:"Gracias por elegirnos una y otra vez. Desbloqueaste {vip}."},
   {tono:"Recompensa cercana",t:"¡Te falta solo 1! 🏆",b:"Con {accion} más, tu recompensa es tuya. Úsala cuando quieras."},
   {tono:"Embajador",t:"Invita a un amigo y ganan los dos 🤝",b:"Comparte tu código. Cuando lo use, ambos reciben {premio}."}]}
};
const CANALES={push:["Push","Inmediato, alto alcance en la app","PU"],wa:["WhatsApp","Conversacional, máxima apertura","WA"],mail:["Email","Contenido largo y visual","EM"],sms:["SMS","Llega sin internet, ideal urgencias","SM"],inapp:["In-app","Contextual mientras usa el producto","IN"]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=()=>S.tipo?"tu app de "+S.tipo.toLowerCase().replace(/^app de /,""):"tu producto";
const VOC={
 "App de delivery":{primera:"tu primer pedido",accion:"un pedido",usos:"pedidos",premio:"envío gratis",novedad:"restaurantes nuevos cerca de ti",rutina:"tu pedido de siempre",momento:"la hora del almuerzo",vip:"envíos gratis ilimitados"},
 "E-commerce":{primera:"tu primera compra",accion:"una compra",usos:"compras",premio:"10% de descuento",novedad:"productos nuevos que van con tu estilo",rutina:"tu carrito favorito",momento:"tu día de compras",vip:"envíos gratis y acceso anticipado a ofertas"},
 "Fintech / billetera":{primera:"tu primera transferencia",accion:"un pago",usos:"pagos",premio:"cashback de bienvenida",novedad:"nuevas formas de hacer crecer tu plata",rutina:"tus pagos de siempre",momento:"el día de pago",vip:"cashback doble y cero comisiones"},
 "App de fitness":{primera:"tu primer entrenamiento",accion:"un entreno",usos:"entrenos",premio:"una semana premium gratis",novedad:"rutinas nuevas para tu nivel",rutina:"tu rutina de siempre",momento:"tu hora de entrenar",vip:"clases premium sin costo"},
 "Streaming / música":{primera:"tu primera playlist",accion:"una sesión",usos:"sesiones",premio:"un mes premium",novedad:"estrenos elegidos para ti",rutina:"tu playlist favorita",momento:"tu momento de desconectarte",vip:"contenido exclusivo antes que nadie"},
 "Programa de puntos":{primera:"tu primera acumulación de puntos",accion:"una compra",usos:"compras",premio:"puntos dobles",novedad:"nuevos aliados donde acumular",rutina:"tus beneficios de siempre",momento:"tu día de compras",vip:"puntos dobles y premios exclusivos"},
 "Edtech":{primera:"tu primera lección",accion:"una lección",usos:"lecciones",premio:"un curso gratis",novedad:"cursos nuevos para tu meta",rutina:"tu clase de siempre",momento:"tu hora de estudio",vip:"certificados y mentorías exclusivas"}};
const fill=s=>{const v=VOC[S.tipo]||VOC["App de delivery"];return esc(s).replace(/\{(\w+)\}/g,(_,k)=>{const w=v[k.toLowerCase()];if(w==null)return esc(P());return esc(k[0]===k[0].toUpperCase()?w[0].toUpperCase()+w.slice(1):w);});};

function ok(){return [S.tipo,S.objetivo,S.evento!=="",S.canales.length>0,S.mensaje>=0][S.step];}
function prog(){document.querySelectorAll("#progress span").forEach((e,i)=>e.classList.toggle("on",i<=Math.min(S.step,4)||S.step===5));}
function nav(){return `<div class="nav">${S.step>0?'<button class="btn ghost" id="back">Atrás</button>':''}<button class="btn primary" id="next" aria-disabled="${!ok()}">${S.step===4?'Ver mi journey':'Siguiente'}</button></div>`;}
function head(n,t,h){return `<span class="step-n">PASO ${n} DE 5</span><h2>${t}</h2><p class="hint">${h}</p>`;}

function render(){
 prog();$("header").hidden=S.step>0;const a=$("#app");let h="";
 if(S.step===0){
  h=head(1,"¿Con qué tipo de producto quieres trabajar?","Elige la opción que más te llame la atención.")+
  `<div class="chips">${TIPOS.map(t=>`<button class="chip ${S.tipo===t?'sel':''}" data-tipo="${esc(t)}">${t}</button>`).join("")}</div>`;
 }else if(S.step===1){
  h=head(2,"¿Cuál es el objetivo de tu journey?","Cada etapa del ciclo de vida pide una estrategia distinta.")+
  `<div class="opts">${Object.entries(OBJ).map(([k,o],i)=>`<button class="opt ${S.objetivo===k?'sel':''}" data-obj="${k}"><span class="ico">${i+1}</span><span><b>${o.n}</b><small>${o.d}</small></span></button>`).join("")}</div>`;
 }else if(S.step===2){
  const o=OBJ[S.objetivo];
  h=head(3,"¿Qué evento dispara el journey?","Automatizar es reaccionar a lo que el usuario hace (o deja de hacer), en el momento justo.")+
  `<div class="opts">${o.eventos.map((e,i)=>`<button class="opt ${S.evento===i?'sel':''}" data-ev="${i}"><span class="ico">⚡</span><span><b>${e[0]}</b><small>Momento: ${e[1]}</small></span></button>`).join("")}</div>`;
 }else if(S.step===3){
  h=head(4,"¿Qué canales crees que funcionan mejor para llegarle a tu usuario?","Elige hasta 3. Más canales no es mejor: cada uno debe tener un rol.")+
  `<div class="opts">${Object.entries(CANALES).map(([k,c])=>`<button class="opt ${S.canales.includes(k)?'sel':''}" data-ch="${k}" aria-pressed="${S.canales.includes(k)}"><span class="ico">${c[2]}</span><span><b>${c[0]}</b><small>${c[1]}</small></span></button>`).join("")}</div>
  <p class="hint">${S.canales.length}/3 seleccionados</p>`;
 }else if(S.step===4){
  const o=OBJ[S.objetivo];
  h=head(5,"¿Qué mensaje conecta mejor?","Elige el que mejor responda a tu objetivo de "+o.n.toLowerCase()+".")+
  `<div class="opts">${o.msgs.map((m,i)=>`<button class="opt ${S.mensaje===i?'sel':''}" data-msg="${i}"><span class="msg-preview"><b>${fill(m.t)}</b><small>${fill(m.b)}</small></span><span class="tag">${m.tono}</span></button>`).join("")}</div>`;
 }else{ a.innerHTML=result(); bindResult(); confetti(); return; }
 a.innerHTML=`<section class="card">${h}${nav()}</section>`;bind();
}

function bind(){
 const p=$("#prod");if(p)p.oninput=e=>{S.producto=e.target.value;$("#next").setAttribute("aria-disabled",!ok());};
 document.querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{S.tipo=b.dataset.tipo;render();});
 document.querySelectorAll("[data-obj]").forEach(b=>b.onclick=()=>{if(S.objetivo!==b.dataset.obj){S.evento="";S.mensaje=-1;}S.objetivo=b.dataset.obj;render();});
 document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{S.evento=+b.dataset.ev;render();});
 document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{const k=b.dataset.ch,i=S.canales.indexOf(k);if(i>=0)S.canales.splice(i,1);else if(S.canales.length<3)S.canales.push(k);render();});
 document.querySelectorAll("[data-msg]").forEach(b=>b.onclick=()=>{S.mensaje=+b.dataset.msg;render();});
 const n=$("#next");n.onclick=()=>{if(!ok())return;S.step++;render();scrollTo({top:0,behavior:"smooth"});};
 const bk=$("#back");if(bk)bk.onclick=()=>{S.step--;render();};
}

const DELAYS=["Al instante","+24 horas, si no reaccionó","+72 horas, último toque"];
const HORAS=["9:41","10:15","18:30"];
const ICONS={
 push:{bg:"linear-gradient(135deg,#713EC2,#4D20CE)",svg:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z"/></svg>'},
 inapp:{bg:"linear-gradient(135deg,#713EC2,#4D20CE)",svg:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z"/></svg>'},
 wa:{bg:"#25D366",svg:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>'},
 mail:{bg:"linear-gradient(180deg,#3FA9F5,#1E6FE8)",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'},
 sms:{bg:"linear-gradient(180deg,#5CE27A,#2DBE4F)",svg:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.7 2 11.2c0 2.6 1.5 4.9 3.8 6.4L5 21l3.8-2c1 .3 2.1.4 3.2.4 5.5 0 10-3.7 10-8.2S17.5 3 12 3z"/></svg>'}
};
const APPNAME=()=>S.tipo.split(" / ")[0].replace(/^App de /,"").replace(/^./,c=>c.toUpperCase());
const NAMES=["Valentina","Sebastián","Mariana","Andrés","Camila","Juan David","Isabella","Santiago","Daniela","Mateo","Sofía","Alejandro","Lucía","Samuel","Gabriela","Nicolás","Paula","Felipe","Laura","Tomás"];
let NAME=NAMES[Math.floor(Math.random()*NAMES.length)];
const VAR={
 activacion:[
  [["Tu regalo sigue esperándote 🎁","Aún puedes reclamar {premio}: haz {primera} y es tuyo."],["Último aviso: tu bienvenida tiene premio 🎁","Tu beneficio de {premio} sigue activo, pero no por mucho. Da el primer paso hoy."]],
  [["Estás a un paso de empezar 🙌","Retoma donde lo dejaste: {primera} está a un par de toques."],["¿Tienes dudas? Te acompañamos","Escríbenos y te guiamos para hacer {primera} en minutos."]],
  [["Quedan 24 horas para tu bono ⏳","Tu beneficio de {premio} sigue activo. Úsalo antes de que se venza."],["Hoy vence tu bono de bienvenida ⏰","Son tus últimas horas para hacer {primera} con {premio}."]]],
 retencion:[
  [["Guardamos algo para ti 👀","Esta semana hay {novedad}. Date una vuelta."],["Hace rato no te vemos 👋","Todo sigue aquí, incluido {rutina}. Te esperamos."]],
  [["Tu racha sigue viva 🔥","Aún estás a tiempo: {accion} más esta semana y subes de nivel."],["Última oportunidad para tu racha 🔥","Hoy es el día: {accion} más y desbloqueas tu próximo nivel."]],
  [["Todo listo para ti ✨","{Rutina} te espera. Solo entra y continúa."],["¿Repetimos lo de siempre?","Con un toque retomas {rutina}, sin perder tiempo."]]],
 fidelizacion:[
  [["Gracias por estar siempre 💛","Tus beneficios VIP ya están activos: {vip}. Entra a disfrutarlos."],["Tu nivel VIP tiene sorpresas 💛","Aún no has usado {vip}. Te están esperando."]],
  [["Tu recompensa está muy cerca 🏆","Solo te falta {accion} para ganarla. ¡Ya casi!"],["No dejes tu recompensa a medias 🏆","{Accion} más y es tuya. Te la tenemos guardada."]],
  [["Tu código para invitar sigue activo 🤝","Compártelo con un amigo y ambos ganan {premio}."],["¿A quién le recomendarías? 🤝","Invita a alguien con tu código. Si lo usa, los dos reciben {premio}."]]]
};
function txt(m,i){if(!i)return m;const v=VAR[S.objetivo][S.mensaje][i-1];return {t:v[0],b:v[1]};}
const WHEN=["ahora","hace 1 d","hace 3 d"];
function variant(ch,m){
 const t=fill(m.t),b=fill(m.b);
 if(ch==="wa")return {app:"WhatsApp",t:"",b:`¡Hola, ${NAME}! ${b}`};
 if(ch==="mail")return {app:"Mail",t,b};
 if(ch==="sms")return {app:"Mensajes",t:"8 9 0 1 2",b:b+" Entra: lnk.co/v8"};
 if(ch==="inapp")return {app:"",t,b,cta:true};
 return {app:"",t,b};
}
function result(){
 const o=OBJ[S.objetivo],ev=o.eventos[S.evento],m=o.msgs[S.mensaje];
 const nodes=S.canales.map((c,i)=>`<div class="node"><div class="dot">${CANALES[c][2]}</div><div><span class="when">${DELAYS[i]}</span><b>${CANALES[c][0]}: ${fill(txt(m,i).t)}</b><p>${CANALES[c][1]}</p>${i>0?'<span class="cond">SI no hizo la acción → continúa</span>':''}</div></div>`).join("");
 const L=S.canales.length;
 const notifs=S.canales.map((c,i)=>{const v=variant(c,txt(m,i));const ic=ICONS[c];return `<div class="notif" style="animation-delay:${(L-1-i)*.4}s"><div class="app" style="background:${ic.bg}">${ic.svg}</div><div><div class="meta"><b>${v.app}</b><span>${WHEN[L-1-i]}</span></div>${v.t?`<div class="t">${v.t}</div>`:''}<div class="b">${v.b}</div>${v.cta?'<span class="cta">Ver ahora</span>':''}</div></div>`;}).reverse().join("");
 const tips=[];
 const n=L;
 if(n===1)tips.push("Con un solo canal dependes de que el usuario lo vea. Prueba sumar un canal de respaldo para quien no reaccionó.");
 else tips.push("Buen uso de varios canales: cada mensaje llega solo si el anterior no funcionó, así no saturas.");
 if(!S.canales.includes("push")&&!S.canales.includes("inapp"))tips.push("Considera Push o In-app: son canales propios del producto y los de menor costo.");
 if(S.objetivo==="fidelizacion"&&S.canales.includes("wa"))tips.push("WhatsApp es ideal para fidelizar: se siente cercano y personal.");
 if(S.canales.includes("sms"))tips.push("Usa el SMS como último recurso: tiene costo por envío y puede sentirse intrusivo.");
 tips.push(`Mide el éxito con un KPI claro: <b>${o.k}</b>.`);
 tips.push("Define una regla de salida: si el usuario ya hizo la acción, el journey se detiene. Nadie quiere un mensaje de lo que ya hizo.");
 tips.push("Haz test A/B del mensaje y del horario antes de escalarlo a toda la base.");
 return `
 <section class="card top">
  <h2 class="done">¡Tu journey está listo!</h2>
  <div class="summary">
   <div><span>Producto</span><b>${esc(S.tipo)}</b></div>
   <div><span>Objetivo</span><b>${o.n}</b></div>
   <div><span>Canales</span><b>${S.canales.map(c=>CANALES[c][0]).join(" · ")}</b></div>
   <div><span>Tono</span><b>${m.tono}</b></div>
  </div>
 </section>
 <section class="card">
  <h2>El flujo automatizado</h2>
  <div class="flow">
   <div class="node"><div class="dot trigger">⚡</div><div><span class="when">DISPARADOR · ${ev[1]}</span><b>${ev[0]}</b><p>El sistema detecta el evento y mete al usuario en el journey.</p></div></div>
   ${nodes}
   <div class="node"><div class="dot goal">✓</div><div><span class="when">META</span><b>${o.k}</b><p>Si lo logra, sale del flujo y pasa a la siguiente etapa del ciclo de vida.</p></div></div>
  </div>
 </section>
 <section class="card">
  <h2>Así le llega a tu usuario</h2>
  <p class="hint">Simulación para ${NAME}, quien usa ${esc(P())}.</p>
  <div class="iphone"><div class="screen"><div class="island"></div><div class="status"><span>9:41</span><i>▂▄▆ 5G ▭</i></div><div class="lock"><div class="d">martes, 3 de noviembre</div><div class="h">9:41</div></div>${notifs}<div class="qa"><span></span><span></span></div><div class="home"></div></div></div>
 </section>
 <section class="card">
  <span class="step-n">SIGUE APRENDIENDO</span><h2>Sugerencias para llevar tu journey al siguiente nivel</h2>
  <ul class="tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul>
  <div class="nav"><button class="btn primary" id="again">Crear otro journey</button></div>
 </section>`;
}
function bindResult(){
 $("#again").onclick=()=>{NAME=NAMES[Math.floor(Math.random()*NAMES.length)];Object.assign(S,{tipo:"",objetivo:"",evento:"",canales:[],mensaje:-1,step:0});render();scrollTo({top:0});};
}
function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 let c=document.getElementById("confetti");if(c)c.remove();
 c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
 const x=c.getContext("2d"),d=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*d;c.height=H*d;x.scale(d,d);
 const cols=["#4D20CE","#713EC2","#D5CDF2","#FFC233","#FF6B8B","#3FC6A0"];
 const ps=Array.from({length:160},()=>({x:W/2+(Math.random()-.5)*60,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
 const t0=performance.now();
 (function f(t){x.clearRect(0,0,W,H);const age=t-t0;
  ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-age/3200);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
  if(age<3200)requestAnimationFrame(f);else c.remove();})(t0);
}
render();
</script>

</body></html>
